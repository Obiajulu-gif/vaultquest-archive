name: Branch Contract Compatibility

on:
  push:
    branches:
      - agent/test-event-wallet-saved-pool-regressions
    paths:
      - ".github/workflows/branch-dependency-locks.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/test-event-wallet-saved-pool-regressions

      - name: Apply SDK compatibility edits
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/if a != \&target {/if a != target {/' contracts/drip-pool/src/lib.rs
          sed -i 's/env.register_contract(None, DripPool).unwrap()/env.register_contract(None, DripPool)/' contracts/drip-pool/tests/event_schema.rs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Generate compatible lockfile
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo update -p ed25519-dalek@3.0.0 --precise 2.2.0
          cargo fmt --all

      - name: Commit verified compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/Cargo.lock contracts/drip-pool/src/lib.rs contracts/drip-pool/tests/event_schema.rs
          git commit -m "fix: lock compatible Soroban test dependencies"
          git push origin HEAD:agent/test-event-wallet-saved-pool-regressions
