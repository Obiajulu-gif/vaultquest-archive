name: Branch Dependency Locks

on:
  push:
    branches:
      - agent/test-event-wallet-saved-pool-regressions
    paths:
      - ".github/workflows/branch-dependency-locks.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/test-event-wallet-saved-pool-regressions

      - name: Configure bot identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Refresh and commit wallet package lock
        shell: bash
        run: |
          set -euo pipefail
          (
            cd stellar-wallet-connect
            npm install --package-lock-only --ignore-scripts
          )
          git add stellar-wallet-connect/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh wallet package lock"
            git push origin HEAD:agent/test-event-wallet-saved-pool-regressions
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate and commit contract lock diagnostics
        shell: bash
        run: |
          set +e
          (
            cd contracts
            cargo generate-lockfile
            cargo update -p ed25519-dalek@3.0.0 --precise 2.2.0 > cargo-pin.log 2>&1
            echo "exit=$?" >> cargo-pin.log
          )
          git add contracts/Cargo.lock contracts/cargo-pin.log
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock contract dependencies"
            git push origin HEAD:agent/test-event-wallet-saved-pool-regressions
          fi
          exit 0
