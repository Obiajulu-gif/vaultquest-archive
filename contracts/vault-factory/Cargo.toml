[package]
name = "vault-factory"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
mock-pool = { path = "../mock-pool" }

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
