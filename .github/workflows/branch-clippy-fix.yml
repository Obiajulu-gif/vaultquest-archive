name: Branch Clippy Fix

on:
  push:
    branches:
      - agent/test-event-wallet-saved-pool-regressions
    paths:
      - "contracts/**"
      - ".github/workflows/branch-clippy-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/test-event-wallet-saved-pool-regressions

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply and commit safe fixes
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged || true
          cargo fmt --all
          if git diff --quiet; then
            echo "No machine-applicable Clippy fixes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply clippy fixes"
          git push origin HEAD:agent/test-event-wallet-saved-pool-regressions
