name: Branch CI Diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/branch-diagnostics.yml"
      - "backend/**"
      - "contracts/**"
      - "stellar-wallet-connect/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p ci-diagnostics
          pnpm install --frozen-lockfile > ci-diagnostics/root-install.log 2>&1
          echo "exit=$?" >> ci-diagnostics/root-install.log
          (
            cd backend
            pnpm install --frozen-lockfile
          ) > ci-diagnostics/backend-install.log 2>&1
          echo "exit=$?" >> ci-diagnostics/backend-install.log
          (
            cd contracts
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          ) > ci-diagnostics/clippy.log 2>&1
          echo "exit=$?" >> ci-diagnostics/clippy.log
          (
            cd stellar-wallet-connect
            npm ci
          ) > ci-diagnostics/wallet-install.log 2>&1
          echo "exit=$?" >> ci-diagnostics/wallet-install.log

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: branch-ci-diagnostics
          path: ci-diagnostics
          if-no-files-found: error
