name: Cross-Stack Conformance Tests

on:
  pull_request:
    paths:
      - "contracts/drip-pool/src/**"
      - "contracts/drip-pool/canonical-spec.ts"
      - "contracts/drip-pool/canonical-spec.json"
      - "contracts/drip-pool/golden-fixtures/**"
      - "contracts/drip-pool/tests/**"
      - "backend/src/constants.ts"
      - "backend/src/types.ts"
      - "backend/src/services/stellarIndexer.ts"
      - "stellar-wallet-connect/src/vault/contract/types.ts"
      - ".github/workflows/conformance.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "contracts/drip-pool/src/**"
      - "contracts/drip-pool/canonical-spec.ts"
      - "contracts/drip-pool/canonical-spec.json"
      - "contracts/drip-pool/golden-fixtures/**"
      - "contracts/drip-pool/tests/**"
      - "backend/src/constants.ts"
      - "backend/src/types.ts"
      - "backend/src/services/stellarIndexer.ts"
      - "stellar-wallet-connect/src/vault/contract/types.ts"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Cross-Stack Contract ↔ Backend ↔ Wallet
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run conformance tests
        run: pnpm vitest run contracts/drip-pool/tests --config contracts/drip-pool/vitest.config.ts

      - name: Validate golden fixtures are up to date
        run: |
          # Check if any golden fixture file was modified without updating the spec
          if git diff --name-only HEAD | grep -q "golden-fixtures/"; then
            echo "Golden fixtures were modified. Please run the fixture regeneration script:"
            echo "  node scripts/regenerate-fixtures.js"
            exit 1
          fi
